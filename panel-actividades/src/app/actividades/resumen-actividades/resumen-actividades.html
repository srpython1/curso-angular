<section aria-labelledby="resumen-titulo">
  <div class="encabezado-seccion">
    <h2 id="resumen-titulo">Resumen</h2>
    <p>{{ total }} actividades registradas</p>
  </div>

  <ul class="metricas" aria-label="Métricas de actividades">
    <li><strong>{{ pendientes }}</strong><span>Pendientes</span></li>
    <li><strong>{{ enProgreso }}</strong><span>En progreso</span></li>
    <li><strong>{{ completadas }}</strong><span>Completadas</span></li>
  </ul>
</section>
